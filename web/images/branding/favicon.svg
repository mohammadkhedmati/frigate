<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Monochrome on purpose: this file is also referenced as <link rel="mask-icon">,
    and Safari pinned tabs use only the shape's alpha channel. The media query
    below is ignored there but keeps the plain SVG favicon legible in dark UI.
  -->
  <style>
    .mark { stroke: #000; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #fff; }
    }
  </style>
  <path
    class="mark"
    d="M112 374V138l144 160 144-160v236"
    fill="none"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
