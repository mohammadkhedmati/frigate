# Minimal Mosquitto config for the Mehrsunai Frigate stack.
#
# Only reachable from the mehrsunai container over the Compose network (no
# port is published to the host), so anonymous access without TLS is fine
# here; do not reuse this config for a broker exposed outside the stack.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
